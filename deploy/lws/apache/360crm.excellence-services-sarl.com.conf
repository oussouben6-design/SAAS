# =====================================================================
# Apache 2.4 — Excellence 360 CRM sur LWS (Cloud KVM / VPS Debian)
#
# Emplacement : /etc/apache2/sites-available/360crm.excellence-services-sarl.com.conf
# Activation  : a2ensite 360crm.excellence-services-sarl.com
#               a2enmod proxy proxy_http headers rewrite brotli http2
#               apache2ctl configtest && systemctl reload apache2
#
# Rôle : terminer HTTPS, servir le domaine et transmettre toutes les requêtes à Next.js
# (127.0.0.1:3000). Les en-têtes de sécurité (CSP, HSTS, X-Frame-Options…) sont émis par
# l'application elle-même (next.config.ts) : ne pas les redéclarer ici, un doublon
# X-Frame-Options/SAMEORIGIN « SAMEORIGIN, SAMEORIGIN » est interprété comme invalide par les
# navigateurs.
# =====================================================================

<VirtualHost *:80>
    ServerName 360crm.excellence-services-sarl.com
    ServerAlias www.360crm.excellence-services-sarl.com

    # Redirection permanente vers HTTPS (le certificat est posé par certbot, étape 5 du guide).
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://360crm.excellence-services-sarl.com%{REQUEST_URI} [R=301,L,QSA]

    ErrorLog  /var/log/apache2/360crm-error.log
    CustomLog /var/log/apache2/360crm-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------
# HTTPS — bloc ajouté/complété par `certbot --apache`, recopié ici pour référence
# ---------------------------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName 360crm.excellence-services-sarl.com
    ServerAlias www.360crm.excellence-services-sarl.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/360crm.excellence-services-sarl.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/360crm.excellence-services-sarl.com/privkey.pem
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off

    # WebSocket non utilisé : la simple proxification suffit aux Server Actions de Next.js.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # 12 Mo : limite haute des Server Actions (next.config.ts) et des téléversements de documents.
    LimitRequestBody 12582912

    # Ordre important : /_next/ est proxifié aussi (aucun fichier local à servir).
    ProxyPass        / http://127.0.0.1:3000/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/

    # Fichiers sensibles éventuellement présents dans le dossier : jamais servis.
    <LocationMatch "^/(\.env|\.env\..*|\.git/.*|package\.json|package-lock\.json|tsconfig\.json)$">
        Require all denied
    </LocationMatch>

    # Compression des réponses HTML/JSON/JS (les fichiers /_next/static sont déjà compressés au build
    # par Next.js, mais brotli/gzip n'a pas de coût significatif ici).
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/css application/javascript application/json image/svg+xml
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    # Les assets versionnés de Next.js sont immuables : cache long, sans requête à l'application.
    <LocationMatch "^/_next/static/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always unset Strict-Transport-Security
    </LocationMatch>

    # @font-face et images publiques : un jour de cache, revalidation ensuite.
    <LocationMatch "^/(logo|embleme|icon|apple-icon|favicon)">
        Header always set Cache-Control "public, max-age=86400"
    </LocationMatch>

    ErrorLog  /var/log/apache2/360crm-ssl-error.log
    CustomLog /var/log/apache2/360crm-ssl-access.log combined
</VirtualHost>
</IfModule>

# ---------------------------------------------------------------------
# Domaine sans sous-domaine (optionnel) : redirige la racine du domaine
# principal vers l'application, si vous voulez aussi l'utiliser.
# ---------------------------------------------------------------------
# <VirtualHost *:443>
#     ServerName excellence-services-sarl.com
#     ServerAlias www.excellence-services-sarl.com
#     Redirect permanent / https://360crm.excellence-services-sarl.com/
# </VirtualHost>
