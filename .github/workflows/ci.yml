name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # CI : base PostgreSQL embarquée (aucun service externe, aucun secret requis).
      DATABASE_MODE: pglite
      ORGANIX_DATA_DIR: .data/ci-db
      ORGANIX_STORAGE_DIR: .data/ci-storage
      APP_URL: http://localhost:3000
      MAIL_TRANSPORT: console
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Préflight Netlify (valeurs factices, aucun secret réel)
        # Vérifie la logique de configuration utilisée par netlify.toml. Les valeurs
        # ci-dessous ne servent qu'à la validation statique ; aucune connexion n'est faite.
        # Avec AUTH_LOGIN_OTP actif par défaut, une configuration complète et valide
        # inclut un transport d'e-mail réel : on simule Resend (factice), pas console.
        run: env -u APP_URL -u NEXT_PUBLIC_APP_URL npm run env:check
        env:
          NETLIFY: "true"
          CONTEXT: "deploy-preview"
          DEPLOY_PRIME_URL: "https://deploy-preview-0--excellence360-ci.netlify.app"
          DATABASE_MODE: "postgres"
          DATABASE_URL: "postgresql://postgres.ci:ci-only@aws-0-eu-west-3.pooler.supabase.com:6543/postgres"
          DATABASE_POOL_MAX: "2"
          AUTO_MIGRATE: "false"
          STORAGE_DRIVER: "supabase"
          SUPABASE_URL: "https://ci.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "ci-only-not-a-real-secret"
          SUPABASE_STORAGE_BUCKET: "documents"
          MAIL_TRANSPORT: "resend"
          RESEND_API_KEY: "ci-only-not-a-real-secret"
          MAIL_FROM: "CI <ci@example.com>"
          MAX_UPLOAD_BYTES: "5242880"

      - name: Tests unitaires et d'intégration
        run: npm run test

      - name: Audit de schéma (dérive et durcissement)
        # Reproduit les migrations sur une base neuve et vérifie que le verrou de schéma,
        # la RLS forcée et l'absence d'exposition PostgREST tiennent.
        run: npm run db:migrate && npm run db:audit
        env:
          ORGANIX_DATA_DIR: .data/audit-db

      - name: Build de production
        run: npm run build
