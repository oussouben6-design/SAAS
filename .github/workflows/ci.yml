name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # CI : base PostgreSQL embarquée (aucun service externe, aucun secret requis).
      DATABASE_MODE: pglite
      ORGANIX_DATA_DIR: .data/ci-db
      ORGANIX_STORAGE_DIR: .data/ci-storage
      APP_URL: http://localhost:3000
      MAIL_TRANSPORT: console
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires et d'intégration
        run: npm run test

      - name: Build de production
        run: npm run build
