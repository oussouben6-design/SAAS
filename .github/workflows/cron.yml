# Maintenance planifiée d'ORGANIX (gratuit sur GitHub Actions).
#
# À configurer dans le dépôt : Settings → Secrets and variables → Actions
#   APP_URL             https://votre-site.exemple.com (Vercel ou Netlify)
#   MAINTENANCE_SECRET  même valeur que la variable d'environnement de l'hébergeur
#
# - toutes les 6 heures : appel de /api/health (supervision + keep-alive Supabase)
# - chaque nuit        : purge des sessions expirées via /api/maintenance
name: Maintenance planifiée

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "5 3 * * *"
  workflow_dispatch:

concurrency:
  group: organix-cron
  cancel-in-progress: false

jobs:
  health:
    name: Disponibilité (/api/health)
    runs-on: ubuntu-latest
    steps:
      - name: Sonder le service
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL non configurée : sonde ignorée."
            exit 0
          fi
          body=$(curl -fsS --max-time 25 "$APP_URL/api/health")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "Service dégradé"; exit 1; }

  purge:
    name: Purge des sessions expirées
    runs-on: ubuntu-latest
    if: github.event.schedule == '5 3 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Appeler /api/maintenance
        env:
          APP_URL: ${{ secrets.APP_URL }}
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$MAINTENANCE_SECRET" ]; then
            echo "APP_URL ou MAINTENANCE_SECRET non configurés : purge ignorée."
            exit 0
          fi
          curl -fsS --max-time 40 -X POST \
            -H "Authorization: Bearer $MAINTENANCE_SECRET" \
            "$APP_URL/api/maintenance"
